<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eaf2ff;
            padding: 50px 15px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #hasil {
            margin-top: 20px;
            font-size: 20px;
            color: #166534;
        }
    </style>
</head>

<body>
    <h1>Website Pertamaku 🚀</h1>
    <p>Tekan tombol di bawah ini!</p>

    <button id="tombol">Klik Saya</button>

    <p id="hasil"></p>

    <script>
        document.getElementById("tombol").addEventListener("click", function() {
            document.getElementById("hasil").textContent =
                "Berhasil! 🎉 Tombol kamu berfungsi!";
        });
    </script>
</body>
</html>
